[project]
name = "plan-for-chicago-2030"
version = "0.1.0"
description = "Comprehensive urban planning analysis platform for reimagining Chicago's land use and transportation"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"

dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "geopandas>=0.14",
    "shapely>=2.0",
    "requests>=2.31",
    "pydeck>=0.9",
    "matplotlib>=3.8",
    "seaborn>=0.13",
    "pmtiles>=3.2",
    "osmnx>=1.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "flake8>=6.0",
    "black>=23.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.black]
line-length = 100
target-version = ["py310"]
