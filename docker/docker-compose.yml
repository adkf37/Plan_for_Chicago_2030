services:
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../data:/app/data
      - ../maps:/app/maps
      - ../reports:/app/reports
      - ../site/data:/app/site/data
    command: ["python", "-m", "src.download_data"]

  tiles:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file:
      - path: ../.env
        required: false
    volumes:
      - ../data:/app/data
      - ../site/data:/app/site/data
    command: ["python", "-m", "src.prepare_map_data"]

  site:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../site:/usr/share/nginx/html:ro
