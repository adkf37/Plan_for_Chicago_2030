version: "3.9"

services:
  pipeline:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    env_file: ../.env
    volumes:
      - ../data:/app/data
      - ../maps:/app/maps
      - ../reports:/app/reports
    command: ["python", "-m", "src.download_data"]

  site:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ../site:/usr/share/nginx/html:ro
      - ../maps:/usr/share/nginx/html/maps:ro
