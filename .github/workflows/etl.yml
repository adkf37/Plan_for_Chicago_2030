name: Weekly Data ETL

on:
  schedule:
    # Run every Sunday at 6:00 AM UTC
    - cron: '0 6 * * 0'
  workflow_dispatch:  # Allow manual trigger

env:
  PYTHON_VERSION: '3.11'

jobs:
  etl:
    name: Download & Validate Data
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run data download
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python -m src.download_data

      - name: Run historical data download
        env:
          SOCRATA_APP_TOKEN: ${{ secrets.SOCRATA_APP_TOKEN }}
        run: |
          python -m src.download_historical

      - name: Validate downloaded files
        run: |
          echo "Checking for required output files..."
          test -f data/geojson/parcel_data.geojson || echo "WARNING: parcel_data.geojson not found"
          test -f data/geojson/assessment_data.geojson || echo "WARNING: assessment_data.geojson not found"
          test -f data/geojson/zoning_data.geojson || echo "WARNING: zoning_data.geojson not found"
          test -f data/geojson/census_tracts.geojson || echo "WARNING: census_tracts.geojson not found"
          test -f data/geojson/cta_stations.geojson || echo "WARNING: cta_stations.geojson not found"
          
          # Count files in geojson directory
          GEOJSON_COUNT=$(ls -1 data/geojson/*.geojson 2>/dev/null | wc -l)
          echo "Found $GEOJSON_COUNT GeoJSON files"
          
          if [ "$GEOJSON_COUNT" -lt 3 ]; then
            echo "ERROR: Expected at least 3 GeoJSON files"
            exit 1
          fi

      - name: Upload data artifacts
        uses: actions/upload-artifact@v4
        with:
          name: etl-data-${{ github.run_number }}
          path: |
            data/geojson/*.geojson
            data/raw/historical/*.csv
          retention-days: 7

      - name: Create summary
        run: |
          echo "## ETL Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Downloaded Files" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          ls -lh data/geojson/*.geojson 2>/dev/null || echo "No GeoJSON files"
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
